[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reotransductor"
version = "2.5.0"
description = "Thermodynamic Simulation of the Active Present Rheotransducer and Emergent Thermal Time"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "José Salinas", email = "jzsalinas@gmail.com" }
]
keywords = [
    "thermodynamics",
    "onsager-reciprocal-relations",
    "entropy-production",
    "landauer-limit",
    "emergent-time",
    "physics-simulation",
    "matplotlib"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.8.0"
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0"
]
gpu = [
    "cupy-cuda12x>=13.0"
]
test = [
    "pytest>=8.0"
]

[tool.setuptools]
packages = ["server", "observational"]
